            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>

            <svg id="icon-cmx" class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>

                     alt="Logo CEN Carvajal" 
                     class="h-10 w-auto object-contain">
              </div>
            </div>
            <div class="p-5 flex-grow flex flex-col justify-center items-center bg-gray-50/50">
              <h3 class="text-lg font-bold text-isdin-black text-center">CEN </h3>

    <!-- INCLUIR WIZARD_UI -->
    <?!= include('wizard_ui'); ?>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      verificarTodosPendientes();
    });

    function volverDashboard() {
      document.querySelectorAll('.modulo-cliente').forEach(m => m.classList.add('hidden'));
      document.getElementById('ui-dashboard').classList.remove('hidden');
    }

    function abrirModulo(cliente) {
      document.getElementById('ui-dashboard').classList.add('hidden');
      if (typeof wizardInit === 'function') {
        wizardInit(cliente);
      } else {
        mostrarError("El asistente no se ha cargado correctamente.");
      }
    }

    function verificarPendientes(cliente, event) {
      if (event) event.stopPropagation();
      const badge = document.getElementById(`badge-${cliente.toLowerCase()}`);
      const icon = document.getElementById(`icon-${cliente.toLowerCase()}`);
      
      if (badge) {
        badge.innerText = 'Cargando...';
        badge.className = 'mt-2 text-[11px] font-bold px-3 py-1 rounded-full bg-gray-100 text-gray-400 border border-gray-200';
      }
      if (icon) icon.classList.add('animate-spin');

      google.script.run
        .withSuccessHandler((count) => {
          if (icon) icon.classList.remove('animate-spin');
          if (badge) {
            if (count > 0) {
              badge.innerText = `${count} pendientes`;
              badge.className = 'mt-2 text-[11px] font-bold px-3 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200 shadow-sm';
            } else {
              badge.innerText = 'Al día (0)';
              badge.className = 'mt-2 text-[11px] font-bold px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200';
            }
          }
        })
        .withFailureHandler((err) => {
          if (icon) icon.classList.remove('animate-spin');
          if (badge) {
            badge.innerText = 'Error';
            badge.className = 'mt-2 text-[11px] font-bold px-3 py-1 rounded-full bg-red-50 text-red-700 border border-red-200';
          }
        })
        .contarArchivosPendientes(cliente);
    }

    function verificarTodosPendientes() {
      ['MEDIPIEL', 'CMX', 'CEN'].forEach(cli => verificarPendientes(cli));
    }

    function mostrarError(msg) {
      Swal.fire({
        icon: 'error',
        title: 'Atención',
        html: msg,
        confirmButtonColor: '#2B2830'
      });
    }

    function descargarArchivoCSV(base64Data, fileName) {
      if (!base64Data) return;
      const cleanBase64 = String(base64Data).replace(/[\r\n]/g, '');
      const link = document.createElement('a');
      link.href = 'data:text/csv;charset=utf-8;base64,' + cleanBase64;
      link.download = fileName || 'Pedido_SAP.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
